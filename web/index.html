<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    
    <!-- Primary Meta Tags -->
    <title>Free Hand - Habit Tracker</title>
    <meta name="title" content="Free Hand - Habit Tracker" />
    <meta name="description" content="Take control of your habits with Free Hand - a simple, effective habit tracking app that helps you build positive routines and break bad habits." />
    <meta name="keywords" content="habit tracker, habit tracking, productivity, self improvement, routine, goals, habits, free hand" />
    <meta name="author" content="Free Hand Team" />
    
    <!-- Theme and Icons -->
    <meta name="theme-color" content="#ffa31a" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://freehand.app/" />
    <meta property="og:title" content="Free Hand - Habit Tracker" />
    <meta property="og:description" content="Take control of your habits with Free Hand - a simple, effective habit tracking app" />
    <meta property="og:image" content="/icon.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://freehand.app/" />
    <meta property="twitter:title" content="Free Hand - Habit Tracker" />
    <meta property="twitter:description" content="Take control of your habits with Free Hand - a simple, effective habit tracking app" />
    <meta property="twitter:image" content="/icon.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Free Hand" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Additional Meta -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <style>
        /* Loading styles */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            border-radius: 12px;
        }
        
        .loading-text {
            color: #ffa31a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .loading-subtitle {
            color: #ffffff;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #ffa31a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide loading when app loads */
        .app-loaded #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <img src="/icon.png" alt="Free Hand Logo" class="loading-logo" />
        <div class="loading-text">Free Hand</div>
        <div class="loading-subtitle">Habit Tracker</div>
        <div class="spinner"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
        // Hide loading screen when app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.classList.add('app-loaded');
            }, 1000);
        });
        
        // PWA Install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
        
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
